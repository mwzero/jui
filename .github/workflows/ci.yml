name: JUI CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test canonical modules and examples
        run: mvn -B -pl jui-core,jui-data,apps/jui-app-customer,apps/jui-app-dashboard,apps/jui-app-survey,apps/jui-app-map,apps/jui-app-media -am test

      - name: Package examples
        run: mvn -B -pl apps/jui-app-customer,apps/jui-app-dashboard,apps/jui-app-survey,apps/jui-app-map,apps/jui-app-media -am package -DskipTests

      - name: Compile standalone playground
        run: mvn -B -f jui-playground/pom.xml -DskipTests package
