<!DOCTYPE html>
<html class="h-full">
<head>
    <title>JUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <script>tailwind.config = { darkMode: 'class' }</script>
    <style>
        .console-scroll::-webkit-scrollbar { width: 8px; }
        .console-scroll::-webkit-scrollbar-track { background: #1f2937; }
        .console-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 h-full transition-colors duration-200">
    <div class="fixed top-4 right-4 z-50">
        <button id="menu-btn" onclick="toggleMenu()" class="p-2 bg-white dark:bg-gray-800 rounded-full shadow-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-gray-700 dark:text-gray-200">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </button>
        <div id="menu-dropdown" class="hidden absolute top-12 right-0 w-56 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden transform transition-all origin-top-right">
            <div class="p-1">
                <button onclick="toggleTheme()" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">Toggle Dark/Light</button>
                <button onclick="toggleConsole()" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">Show Console</button>
            </div>
        </div>
    </div>

    <div id="app-container" class="max-w-6xl mx-auto p-6 bg-white dark:bg-gray-800 shadow-xl rounded-xl mt-8 mb-32 transition-colors duration-200 min-h-[50vh]">
        <div class="text-center text-gray-500 dark:text-gray-400 mt-10">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent text-indigo-600 rounded-full" role="status" aria-label="loading"></div>
            <p class="mt-2">Connecting to server...</p>
        </div>
    </div>

    <div id="console-panel" class="fixed bottom-0 left-0 w-full h-48 bg-gray-900 text-green-400 font-mono text-xs p-4 hidden border-t border-gray-700 shadow-2xl z-40 flex flex-col">
        <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1">
            <span class="font-bold text-gray-300">System Console</span>
            <button onclick="toggleConsole()" class="text-gray-400 hover:text-white">✕</button>
        </div>
        <div id="console-logs" class="flex-1 overflow-y-auto console-scroll space-y-1"><div class="opacity-50">[SYSTEM] Console ready.</div></div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">Notification</div>

    <script>
        const container = document.getElementById('app-container');
        const loadedDependencies = new Set();
        let sid = sessionStorage.getItem('sid');
        if (!sid) {
            sid = crypto.randomUUID();
            sessionStorage.setItem('sid', sid);
        }

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            toggleMenu();
        }

        function toggleMenu() { document.getElementById('menu-dropdown').classList.toggle('hidden'); }
        function toggleConsole() {
            document.getElementById('console-panel').classList.toggle('hidden');
            logToConsole('[UI] Console visibility toggled.');
            const menu = document.getElementById('menu-dropdown');
            if (!menu.classList.contains('hidden')) menu.classList.add('hidden');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function logToConsole(msg) {
            const logs = document.getElementById('console-logs');
            const entry = document.createElement('div');
            entry.innerText = `> ${msg}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        async function injectDependencies(deps) {
            if (!deps) return;
            for (const [key, html] of Object.entries(deps)) {
                if (loadedDependencies.has(key)) continue;
                const wrapper = document.createElement('div');
                wrapper.innerHTML = html.trim();
                const source = wrapper.firstElementChild;
                if (!source) continue;
                const node = document.createElement(source.tagName.toLowerCase());
                for (const attr of source.attributes) node.setAttribute(attr.name, attr.value);
                node.textContent = source.textContent;
                if (node.tagName === 'SCRIPT' && node.src) {
                    node.async = false;
                    await new Promise((resolve, reject) => {
                        node.onload = resolve;
                        node.onerror = reject;
                        document.head.appendChild(node);
                    });
                } else {
                    document.head.appendChild(node);
                }
                loadedDependencies.add(key);
            }
        }

        async function executeScripts(root) {
            const scripts = Array.from(root.querySelectorAll('script'));
            for (const oldScript of scripts) {
                const script = document.createElement('script');
                for (const attr of oldScript.attributes) script.setAttribute(attr.name, attr.value);
                script.textContent = oldScript.textContent;
                if (script.src) {
                    script.async = false;
                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = reject;
                        oldScript.replaceWith(script);
                    });
                } else {
                    oldScript.replaceWith(script);
                }
            }
        }

        async function applyServerPayload(data) {
            await injectDependencies(data.htmlDependencies);
            if (data.fullPage && data.html && data.html.toLowerCase().includes('<html')) {
                document.open();
                document.write(data.html);
                document.close();
                return;
            }
            if (data.html !== undefined) {
                container.innerHTML = data.html;
                await executeScripts(container);
                logToConsole('[SERVER] UI update received.');
            }
        }

        async function sendUpdate(id, val) {
            logToConsole(`[EVENT] Widget ${id} changed.`);
            try {
                const r = await fetch('/ui?sessionId=' + encodeURIComponent(sid), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, value: val })
                });
                if (!r.ok) throw new Error('Server responded with ' + r.status);
                await applyServerPayload(await r.json());
            } catch (e) {
                console.error(e);
                logToConsole('[ERROR] ' + e.message);
                showToast(e.message);
            }
        }

        async function juiUploadFile(id, input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const max = 5 * 1024 * 1024;
            if (file.size > max) {
                showToast('File is larger than 5 MB');
                input.value = '';
                return;
            }
            const dataUrl = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
            const base64 = String(dataUrl).split(',', 2)[1] || '';
            await sendUpdate(id, { name: file.name, contentType: file.type || 'application/octet-stream', size: file.size, base64 });
        }

        async function juiMultiCheck(id) {
            const selected = Array.from(document.querySelectorAll(`[data-jui-multi="${id}"]:checked`)).map(el => el.value);
            await sendUpdate(id, selected);
        }

        function juiGoogleLogin(endpoint) {
            window.location.href = endpoint + '?sessionId=' + encodeURIComponent(sid);
        }

        async function load() {
            initTheme();
            logToConsole('[INIT] Connecting to Session ' + sid);
            try {
                const r = await fetch('/ui?sessionId=' + encodeURIComponent(sid));
                if (!r.ok) throw new Error('Server responded with ' + r.status);
                await applyServerPayload(await r.json());
                logToConsole('[INIT] App loaded successfully.');
            } catch (e) {
                container.innerHTML = `<div class='text-center text-red-500'>Server unreachable.<br>${e.message}</div>`;
            }
        }

        window.sendUpdate = sendUpdate;
        window.juiUploadFile = juiUploadFile;
        window.juiMultiCheck = juiMultiCheck;
        window.juiGoogleLogin = juiGoogleLogin;
        window.juiSessionId = () => sid;
        window.onload = load;

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('menu-dropdown');
            const btn = document.getElementById('menu-btn');
            if (!menu.contains(event.target) && !btn.contains(event.target) && !menu.classList.contains('hidden')) menu.classList.add('hidden');
        });
    </script>
</body>
</html>
